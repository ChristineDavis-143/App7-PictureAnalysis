  Brief Description of Goal of Code:
  This code allows the user to upload an image, display the original image on a canvas, and process the image to extract and display only the blue color channel on a second canvas.
 
  Known Issues:
  - The canvases may not display images correctly if the JavaScript runs before the DOM elements are fully loaded.
  - Some mobile browsers (especially iOS Safari) may cause image scaling or rendering issues on canvas.
  - Large images may appear stretched or distorted due to fixed canvas dimensions (600 × 500).
  - The app currently only applies a blue filter (no other color processing options).
  - File input errors may occur if a non-image file is selected.

<!DOCTYPE html>
<html lang="en">
 
 <head>
  <meta charset="utf-8">
  <title>Picture Analysis</title>

<!--Makes the app mobile-friendly -->
  <meta name="viewport" content="width=device-width, initial-scale=.7">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!--jQuery Mobile styling and scripts -->
  <link rel="stylesheet" href="https://code.jquery.com/mobile/1.3.2/jquery.mobile-1.3.2.min.css" />
  <script src="https://code.jquery.com/jquery-1.9.1.min.js"></script>
  <script src="https://code.jquery.com/mobile/1.3.2/jquery.mobile-1.3.2.min.js"></script>

 <script> 
  // =========================
    // DEBUG MESSAGE
    // =========================
  console.log("Script loaded");

  // =======================================
  // iOS IMAGE FIX FUNCTIONS (DO NOT MODIFY)
  // =======================================

  // This function detects if an image is vertically squished
  // This bug occurs on some iPhone iOS images when ddrawn to canvas
 function detectVerticalSquash(img) {
  
  var iw = img.naturalWidth, ih = img.naturalHeight;

  // Create temporary canvas to analyze pixels
  var canvas = document.createElement('canvas');
  canvas.width = 1;
  canvas.height = ih;
  
  var ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);
  
  var data = ctx.getImageData(0, 0, 1, ih).data;
  
  var sy = 0, var ey = ih, var py = ih;

  // Binary search to detect squash ratio
  while (py > sy) {
   var alpha = data[(py - 1) * 4 + 3];
   if (alpha === 0) ey = py;
   else sy = py;
   py = (ey + sy) >> 1;
  }
  
  var ratio = (py / ih);
  return (ratio === 0) ? 1 : ratio;
 }
  
// Fixes image squishing when drawing to canvas
 function drawImageIOSFix(ctx, img, sx, sy, sw, sh, dx, dy, dw, dh) {
   var vertSquashRatio = detectVerticalSquash(img);
   ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh / vertSquashRatio);
 }

  // =========================
    // CANVAS SETUP VARIABLES
    // =========================
    var canvas, context, canvas2, context2;

    //  Wait until page is fully ready (jQuery Mobile safe event)
    $(document).on("pageshow", function () {

      // Get canvas elements
      canvas = document.getElementById('myCanvas');
      context = canvas.getContext("2d");

      canvas2 = document.getElementById('canvas2');
      context2 = canvas2.getContext("2d");

      // Placeholder text for first canvas
      context.font = '20pt Calibri';
      context.fillStyle = "black";
      context.fillText("Original image will go here", 10, 20);

      // Placeholder text for second canvas
      context2.font = '20pt Calibri';
      context2.fillStyle = "blue";
      context2.fillText("Blue intensity image will appear here", 10, 20);
    });

// =========================
    // MAIN IMAGE PROCESSING
    // =========================
    $(document).on("pageshow", function () {

      // Listen for file input changes (user selects image)
      document.getElementById('fileInput').addEventListener('change', function () {

        var file = this.files[0];
        var imageType = /image.*/;

       // Check if file is an image 
       if (!file || !file.type.match(imageType)) {
          document.getElementById('messageDisplayArea').innerHTML = "File not supported!";
          return;
        }

        var reader = new FileReader();

        // Runs after file is read
        reader.onload = function () {

          document.getElementById('messageDisplayArea').innerHTML = "You picked an image!";

          var img = new Image();

          img.onload = function () {

            console.log("Image loaded:", img.width, img.height);

            // Clear canvases before drawing new image
            context.clearRect(0, 0, 600, 500);
            context2.clearRect(0, 0, 600, 500);

            // Draw original image onto first canvas
            drawImageIOSFix(
             context, 
             img, 
             0, 0, 
             img.naturalWidth, 
             img.naturalHeight, 
             0, 0, 
             600, 500
            );

            // Get pixel data from first canvas
            var imageData = context.getImageData(0, 0, 600, 500);
           // Create empty image data for second canvas
            var newImageData = context2.createImageData(600, 500);

            // Loop through all pixels (RBGA format)
            for (var i = 0; i < imageData.data.length; i += 4) {
              var blue = imageData.data[i + 2];

             // Set only blue channel (remove red and green)
              newImageData.data[i] = 0;        // Red
              newImageData.data[i + 1] = 0;    // Green
              newImageData.data[i + 2] = blue; // Blue
              newImageData.data[i + 3] = 255;  // Fully visible (alpha)
            }

           // Draw processed image onto second canvas
            context2.putImageData(newImageData, 0, 0);
          };

         // Start loading image
          img.src = reader.result;
        };

       // Read file as image data URL
        reader.readAsDataURL(file);
      });
    });

  </script>
</head>

<body>

  <div data-role="page">

   <!-- Header section -->
    <div data-role="header">
      <h1>Primary Colors</h1>
    </div>

   <!-- Main content section -->
    <div data-role="content">

      <h2>Upload an image to analyze colors</h2>

      <!-- File input button -->
      <p>Press button to choose image file:</p>
      <input type="file" id="fileInput" style="background-color:#FF6600;">

     <!-- Status message display -->
      <div id="messageDisplayArea"></div>

     <!-- Canvas 1: original image -->
      <canvas id="myCanvas" width="600" height="500" style="border:1px solid #d3d3d3;"></canvas>

     <!-- Canvas 2: processed image (blue filter) -->
      <canvas id="canvas2" width="600" height="500" style="border:1px solid #d3d3d3;"></canvas>

    </div>

   <!-- Footer section -->
    <div data-role="footer" data-position="fixed">
      <p>DIY Diagnostics</p>
    </div>

  </div>

</body>
</html>
