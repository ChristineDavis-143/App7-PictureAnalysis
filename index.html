<!DOCTYPE html>
<html lang="en">
 
 <head>
  <meta charset="utf-8">
  <title>Picture Analysis</title>

<!--Makes the app mobile-friendly -->
  <meta name="viewport" content="width=device-width, initial-scale=.7">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!--jQuery Mobile styling and scripts -->
  <link rel="stylesheet" href="https://code.jquery.com/mobile/1.3.2/jquery.mobile-1.3.2.min.css" />
  <script src="https://code.jquery.com/jquery-1.9.1.min.js"></script>
  <script src="https://code.jquery.com/mobile/1.3.2/jquery.mobile-1.3.2.min.js"></script>

 <script> 
  // ===================================
  // BASIC DEBUGGING INFORMATION
  // ===================================
   
  // Store the last modified date of this file
  // Helps confirm that the newest version is running
  var docMod = document.lastModified; // accidentially declared this twice (deleted this)

  // Print the last modified date to the console
  // View this in Developer Tools -> Console
  console.log("This file last modified " + docMod);

  // =======================================
  // iOS IMAGE FIX FUNCTIONS (DO NOT MODIFY)
  // =======================================

  // This function detects if an image is vertically squished
  // This bug occurs on some iPhone iOS images when ddrawn to canvas
 function detectVerticalSquash(img) {
  
  var iw = img.naturalWidth, ih = img.naturalHeight;

  // Create temporary canvas to analyze pixels
  var canvas = document.createElement('canvas');
  canvas.width = 1;
  canvas.height = ih;
  
  var ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);
  
  var data = ctx.getImageData(0, 0, 1, ih).data;
  
  var sy = 0;
  var ey = ih;
  var py = ih;

  // Binary search to detect squash ratio
  while (py > sy) {
   var alpha = data[(py - 1) * 4 + 3];
   
   if (alpha === 0) {
    ey = py;
   } 
    
   else {
    sy = py;
   }
   
   py = (ey + sy) >> 1;
  }
  var ratio = (py / ih);
  
  return (ratio===0)?1:ratio;
 }
  
// Fixes image squishing when drawing to canvas
 function drawImageIOSFix(ctx, img, sx, sy, sw, sh, dx, dy, dw, dh) {
 
  var vertSquashRatio = detectVerticalSquash(img);
  
  ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh / vertSquashRatio);
 }

  // ==============================
  // MAIN PROGRAM STARTS HERE
  // ==============================

  // Wait until entire page loads before running JavaScript
/* window.onload necessary to keep javascripts from running before the app gets a chance to load entirely. */
 window.onload = function() {

  // Get HTML elements
  var fileInput = document.getElementById('fileInput');
  var messageDisplayArea = document.getElementById('messageDisplayArea');
  /* fileInput.addEventListener looks for any change in the <input> tag indicating that the user has selected a file (picture). */
  
  // Triggered whenever user selects a file
  fileInput.addEventListener('change', function(e) {

   // Get selected file
    var file = fileInput.files[0];

   // Check if file is an image
    var imageType = /image.*/;

   // FileReader converts the file into usable data
    /* if (file.type.match(imageType)) checks that the selected file is indeed an image. */
    if (file.type.match(imageType)) {
      /* new FileReader(); and reader.onload start some kind of file reading process in javaScript. I do not understand why this is necessary although it may simply slow things down to let the image load. */
      var reader = new FileReader();
      reader.onload = function(e) {
        /* messageDisplayArea.innerHTML not needed but allows you to send a message at this point in the program. */
        messageDisplayArea.innerHTML = "You picked an image!";
        /* new Image() and img.onload start some kind of new image creation process in javaScript. I do not understand why this is necessary although it may simply slow things down to let the image load. */
        var img = new Image();
        img.onload = function() {
          // Runs AFTER image is fully loaded
         
        // Draw original image onto Canvas 1
          drawImageIOSFix(context,img, 0, 0, img.naturalWidth, img.naturalHeight, 0, 0, 600, 500);

         // ========================================
         // BEGIN IMAGE PROCESSING (Blue Filter)
         // ========================================

          /* PUT ANY CHANGES TO THE JAVASCRIPT HERE  */
          // Get pixel data from first canvas
         var imageData = context.getImageData (0, 0, 600, 500);
          
         // Create new image data for second canvas
         var newImageData = context2.createImageData(600, 500);

         // Loop through every pixel (RGBA format)
         for (var i = 0; i < imageData.data.length; i += 4) {

           // Red = index i
           // Green = index i+1
           // Blue = index i+2
           // Alpha = index i+3

          var blue = imageData.data[i + 2];

          //Remove red and green, keep blue only
          newImageData.data[i] = 0;
          newImageData.data[i + 1] = 0;
          newImageData.data[i + 2] = blue;
          newImageData.data[i + 3] = 255; // fully visible
         }

         // Draw processed image ot second canvas
         context2.putImageData(newImageData, 0, 0);

         // =========================================
         // END IMAGE PROCESSING
         // =========================================

        } // end of img.onload

       // Set image source -> triggers img.onload
        img.src = reader.result;
      } //  end of reader.onload

     // Start reading file
      reader.readAsDataURL(file);
    } // end of the if statement checking that file is an image
    else
    {
      // If not an image file
      messageDisplayArea.innerHTML = "File not supported!"
    } // end of the else statement if file in NOT an image
  }); // end  event listener
 } // end window.onload
 </script>
 </head>

 <body>
  <div data-role="page">
    <div data-role="header">
    <h1>Primary Colors</h1></div><!-- /header -->
    <div data-role="content">	
      <h2>Push button to take picture.</h2>
      <div>
        Press orange button to create or choose image file:
        <input type="file" id="fileInput" STYLE="background-color: #FF6600;">
      </div>
      <div id="messageDisplayArea"></div>

     <!-- ORIGINAL IMAGE CANVAS -->
      <canvas id="myCanvas" width=600 height=500 style="border:1px solid #d3d3d3;"></canvas>

     <!-- SECOND CANVAS (BLUE FILTER) -->
     <canvas id="canvas2" width=600 height=500 style="border:1px solid #d3d3d3;"></canvas>
     
      <script> 

       // Initialize first canvas
        var canvas = document.getElementById('myCanvas');
        var context = canvas.getContext("2d");
       
        context.font = '20pt Calibri';
        context.fillStyle = "black";
        context.fillText("Original image will go here", 10, 20);

       // Initialize second canvas
       var canvas2 = document.getElementById('canvas2');
       var context2 = canvas2.getContext("2d");

       context2.font = '20pt Calibri';
       context2.fillStyle = "blue";
       context2.fillText("Blue intensity image will appear here", 10, 20);

      </script>

    </div><!-- /content -->
    <div data-role="footer" data-position="fixed">
      <p>DIY Diagnostics</p>
    </div><!-- /footer -->
  </div><!-- /page -->
 </body>
</html>
